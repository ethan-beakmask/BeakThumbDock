<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>00–99 隨機數字監控測試</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    body { display:flex; align-items:center; justify-content:center; }
    #number {
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      font-weight:900;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
      line-height:1;
      user-select:none;
    }
  </style>
</head>
<body>
  <div id="number" aria-live="off">00</div>
  <script>
    const display = document.getElementById('number');
    let previous = -1;
    function resizeText() {
      const maxWidth = window.innerWidth * 0.94;
      const maxHeight = window.innerHeight * 0.92;
      let low = 1, high = Math.max(1, Math.floor(Math.max(innerWidth, innerHeight) * 2));
      while (low < high) {
        const mid = Math.ceil((low + high) / 2);
        display.style.fontSize = mid + 'px';
        if (display.getBoundingClientRect().width <= maxWidth && display.getBoundingClientRect().height <= maxHeight) low = mid;
        else high = mid - 1;
      }
      display.style.fontSize = low + 'px';
    }
    function updateNumber() {
      let next = Math.floor(Math.random() * 99);
      if (previous >= 0 && next >= previous) next++;
      previous = next;
      display.textContent = String(next).padStart(2, '0');
      resizeText();
    }
    window.addEventListener('resize', resizeText);
    updateNumber();
    setInterval(updateNumber, 1000);
  </script>
</body>
</html>
